name: Voice clips
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/audio/lines.json', '.github/scripts/voice.mjs', '.github/workflows/voice.yml']
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency: voice-clips
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: which ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - run: node .github/scripts/voice.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          git diff --cached --quiet && exit 0
          git commit -m "Voice clips"
          git pull --rebase origin main
          git push origin HEAD:main
